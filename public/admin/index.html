<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>Content Manager</title>
  </head>
  <body>
    <!-- Include the script that builds the page and powers Decap CMS -->
    <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>
    <script>
      // Dirty hack to customize GitHub backends tokenKeyword
      // By default it is "token", but @fastify/jwt uses "Bearer"
      const oldInit = CMS.getBackend("github").init;
      const newInit = (...args) => {
        const backendInstance = oldInit(...args);
        backendInstance.tokenKeyword = "Bearer";
        return backendInstance;
      };
      CMS.getBackend("github").init = newInit;
    </script>
  </body>
</html>
